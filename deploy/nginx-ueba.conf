# ─────────────────────────────────────────────────────────────────────────────
# CyberSentinel UEBA — TLS reverse proxy
#   /etc/nginx/conf.d/ueba.conf
#
# A separate file on purpose: nothing in sites-available/cybersentinel (the
# SIEM UI on 3000) is touched, so this can be removed again by deleting one
# file and reloading.
#
# Port 3443, not 443: sites-available/default declares `listen 443 ssl
# default_server` and although it is not currently symlinked into
# sites-enabled, taking 443 here would collide the moment somebody enables it.
# 3443 also mirrors the SIEM's own 3000 convention.
#
# The Flask app stays bound to 127.0.0.1 and is NOT exposed directly. nginx is
# the only LAN listener, which is why the bind never needed changing: TLS
# terminates here and the hop to the app never leaves the loopback interface.
#
# Certificate is the host's existing self-signed cert (CN=10.200.10.23, SANs
# cover that IP plus 127.0.0.1, valid to 2027-04-10) — the same one the SIEM
# UI presents, so browsers behave identically for both and there is one trust
# decision to make, not two.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 3443 ssl;
    http2 on;
    server_name 10.200.10.23 csen-siem.vgipl.com localhost;

    ssl_certificate     /etc/ssl/cybersentinel/web.crt;
    ssl_certificate_key /etc/ssl/cybersentinel/web.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:UEBA_SSL:4m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "same-origin" always;

    # Compression. nginx.conf ships with `#gzip on;` commented out, so the SPA
    # was transferring ~6.8 MB uncompressed on every cold load — 2.1 MB of that
    # is the globe.gl and three.js bundles, which compress to roughly a
    # quarter. Enabled per-server so the rest of this host's nginx behaviour is
    # untouched.
    #
    # NOT applied to the SSE stream: gzip buffers output to fill a compression
    # window, which is exactly how an infinite event stream appears to hang.
    # The /api/stream block below sets `gzip off` explicitly rather than
    # relying on the type list, because text/event-stream is easy to add to
    # gzip_types by accident later.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/geo+json image/svg+xml;

    access_log /var/log/nginx/ueba.access.log;
    error_log  /var/log/nginx/ueba.error.log warn;

    # /api/feed returns multi-megabyte JSON on wide timeline windows, and a
    # report generation request can run for a while before it answers.
    client_max_body_size 16m;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # Server-Sent Events. /api/stream is an infinite open stream: with
    # buffering on, nginx holds events back waiting for a buffer to fill and
    # the live feed appears frozen; with the default 60s read timeout it is
    # cut every minute. Declared before the catch-all so it wins.
    location /api/stream {
        gzip off;
        proxy_pass http://127.0.0.1:3026;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must never be cached. Vite fingerprints the asset filenames,
    # so a rebuild produces index-<newhash>.js and a fresh index.html pointing
    # at it — but a browser holding a cached index.html keeps requesting the
    # OLD hash and silently runs the previous build. That is exactly how an
    # enforcement cutover looked like a broken dashboard: the server required
    # a login while the cached bundle predated the login gate existing.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        proxy_pass http://127.0.0.1:3027;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted assets are immutable by construction: a change of content
    # is a change of filename, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://127.0.0.1:3027;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA serves its own shell for /overview, /feed and friends, and that
    # response is index.html — so it must not be cached either.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        proxy_pass http://127.0.0.1:3026;
        proxy_http_version 1.1;

        # X-Forwarded-Proto is what lets the app know the client arrived over
        # TLS even though this hop is plain HTTP over loopback.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
