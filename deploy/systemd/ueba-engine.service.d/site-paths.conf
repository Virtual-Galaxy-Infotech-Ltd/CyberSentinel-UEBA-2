[Service]
# Read configuration and secrets from /etc/ueba, not from the install tree.
#
# WHY: the install directory is a git working tree. On 18-Nov-2026 a git pull
# there deleted both EnvironmentFiles and reverted ueba_config.yaml to the
# shipped defaults. The console restart-looped and nginx served 502 for ~25
# minutes. The SSO secret survived only because a running process still held
# it in its environment and it could be read back from /proc; one restart
# earlier and the token contract with the SIEM team would have been gone.
#
# Nothing under /etc/ueba is inside a git tree, so no pull, checkout or clean
# can reach it.
#
# The empty assignments are required, not decoration: in a drop-in,
# EnvironmentFile= and ExecStart= APPEND to the unit's existing list.
# Resetting each to empty first is what replaces the old paths.
EnvironmentFile=
EnvironmentFile=/etc/ueba/ueba_site.env
EnvironmentFile=/etc/ueba/ueba_runtime.env
ExecStart=
ExecStart=/opt/ueba/venv/bin/python3 /opt/ueba/ueba_engine.py --config /etc/ueba/ueba_config.yaml
