[Service]
# Memory limits for the console, and the history behind the numbers.
#
# 17-Nov-2026  oom-killed at a 3.056 GB peak against MemoryMax=3G, with a
#              2.53 GB steady state. No headroom for any transient.
#
# 18-Nov       MemoryHigh=2300M added so the kernel would reclaim instead of
#              kill. Wrong value: the real working set is ~2.4 GB, so the soft
#              limit sat UNDER it. memory.events recorded 60,209 throttle
#              events and the cgroup was fully stalled 22% of the time — the
#              service stayed up and answered slowly enough to read as a
#              gateway timeout in a browser. A soft limit below the working set
#              is a throttle, not a safety net. Raised to 2900M, just under
#              MemoryMax, so it engages only near the ceiling.
#
# 18-Nov 17:50 oom-killed again, at exactly 3072 MB. The process's own
#              accounting at that moment: 940 MB across every cache it can
#              name, 2132 MB unattributed. So what kills this service is not
#              cached data — it is transient allocation while the endpoint
#              builders aggregate a 232,000-alert window in Python. No cache
#              eviction addresses that, and neither does this file; a wider
#              limit only gives the transient somewhere to fit.
#
#              Raised to 4G/3500M as a STOP-GAP. Defensible now because the
#              host picture changed: free RAM was ~850 MB when the first limit
#              was set and ~2.6 GB now, with ~14 GB available, so one extra
#              gigabyte here is about 7% of that. It would not have been
#              defensible the day before.
#
# THE ACTUAL FIX is ueba_alert_store.py: the same aggregates as indexed SQL,
# measured at 0.3-0.4s each over the full 236,535-alert corpus with nothing
# held resident, against a 205-221s pre-warm that leaves 922 MB in RAM for the
# life of the process. These limits can come back down once the endpoints read
# from the store instead of from a window in memory.
#
# Related lever, currently disabled by configuration: preprocessing's
# max_feed_alerts is 2000000, which for this data volume is no cap at all. The
# code applies it before a window is built and reports the pre-cap total so
# /api/stats can say a window was truncated. Setting it to a real number bounds
# every builder's input immediately — at the cost of wide-window aggregates
# being computed over the most recent N alerts rather than all of them, which
# is a product decision and not a deployment one.
MemoryMax=4G
MemoryHigh=3500M
