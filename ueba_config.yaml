# ─────────────────────────────────────────────────────────────────────────────
# CyberSentinel UEBA Engine — Configuration (164.52.194.98)
# ueba_config.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  enriched_input:       "/root/NEW_DRIVE/aditya_ueba/enriched.jsonl"
  ueba_output:          "/root/NEW_DRIVE/aditya_ueba/ueba_alerts.jsonl"
  training_data:        "/root/NEW_DRIVE/aditya_ueba/data/combined_training.jsonl"
  features_h5:          "/root/NEW_DRIVE/aditya_ueba/data/features.h5"
  profile_db:           "profiles/user_profiles.db"
  models_dir:           "models/"
  isolation_forest:     "models/isolation_forest.pkl"
  scaler:               "models/scaler.pkl"
  autoencoder_dir:      "models/autoencoders/"
  global_autoencoder:   "models/autoencoders/global.pt"
  faiss_index:          "vector_db/faiss.index"
  faiss_metadata:       "vector_db/metadata.jsonl"
  state_file:           ".state/ueba.state"
  log_file:             "logs/ueba_engine.log"
  trainer_log:          "logs/ueba_trainer.log"
  preprocessor_log:     "logs/ueba_preprocessor.log"
  # Engine reads this file on each event (mtime-tracked, no restart needed).
  # Written by the dashboard whenever an analyst marks an alert as FP.
  # Must point at the same file the dashboard writes (`dashboard.false_positives_file`'s sibling).
  fp_patterns_file:     "/root/NEW_DRIVE/aditya_ueba/fp_patterns.json"
  # Analyst watch lists (RFP point 1). Same contract as fp_patterns_file: the
  # dashboard writes it via /api/watchlist, the engine mtime-reloads it on each
  # event. Watched users/hosts/IPs get a small additive score boost applied
  # before the alert threshold, so their borderline activity surfaces.
  # See ueba_watchlist.py for why that boost is deliberately small.
  watchlist_file:       "/root/NEW_DRIVE/aditya_ueba/watchlist.json"


# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  chunk_size: 50000
  min_events_per_user: 2000

  feature_fields:
    temporal:
      - "enrich.temporal.hour"
      - "enrich.temporal.day_of_week"
      - "enrich.temporal.is_weekend"
      - "enrich.temporal.is_business_hours"
      - "enrich.temporal.is_night_shift"

    flags:
      - "enrich.flags.is_auth_event"
      - "enrich.flags.is_network_event"
      - "enrich.flags.is_file_event"
      - "enrich.flags.is_process_event"

    anomalies:
      - "enrich.anomalies.is_brute_force"
      - "enrich.anomalies.is_port_scan"
      - "enrich.anomalies.is_tor"
      - "enrich.anomalies.is_malicious_ip"
      - "enrich.anomalies.is_impossible_travel"
      - "enrich.anomalies.is_lateral_movement"
      - "enrich.anomalies.is_data_exfiltration"
      - "enrich.anomalies.is_after_hours"
      - "enrich.anomalies.is_high_frequency"

    counters:
      - "enrich.counters.src_ip_5m"
      - "enrich.counters.src_ip_1h"
      - "enrich.counters.user_1h"
      - "enrich.counters.host_1h"

    behavioral:
      - "enrich.behavioral.unique_destinations_1h"
      - "enrich.behavioral.unique_ports_1h"
      - "enrich.behavioral.recent_failures_5m"

    geo:
      - "enrich.geo.distance_km"
      - "enrich.geo.cross_border"
      - "enrich.geo.cross_continent"

    risk:
      - "enrich.risk_score"
      - "rule.level"

    network:
      - "enrich.network_intel.is_cloud_provider"

    categorical:
      event_category:
        field: "event_category"
        mapping:
          auth:     0
          network:  1
          process:  2
          file:     3
          dns:      4
          web:      5
          malware:  6
          cloud:    7
          policy:   8
          system:   9
          unknown:  10

      event_outcome:
        field: "event_outcome"
        mapping:
          success:  0
          failure:  1
          unknown:  2

      traffic_direction:
        field: "enrich.classification.traffic_direction"
        mapping:
          inbound:   0
          outbound:  1
          internal:  2
          unknown:   3

  feature_dim: 35
  null_fill_value: 0.0


# ── Isolation Forest ──────────────────────────────────────────────────────────
isolation_forest:
  contamination: 0.005
  n_estimators: 200
  max_samples: "auto"
  n_jobs: -1
  random_state: 42
  training_sample_size: 500000

  # ── Score mapping — FIT THIS PER ESTATE ────────────────────────────────────
  # The raw sklearn score becomes a 0-1 anomaly score. Without score_range the
  # mapping is the historical clip(-raw / 0.5, 0, 1), which assumes raw scores
  # span 0.0 (normal) to -0.5 (anomalous).
  #
  # THAT ASSUMPTION DOES NOT TRANSFER BETWEEN ESTATES. On the first co-located
  # deployment, raw scores over 120,000 real events spanned only
  # -0.6026..-0.3646 — entirely past the old -0.5 floor for anything that
  # became an alert. The anomaly score therefore clipped to exactly 1.0 for
  # 100% of alerts (27% of all traffic), so the Isolation Forest contributed a
  # flat 1.0 to half the fused score and 54% of alerts came out
  # "highly_anomalous". A severity column where everything is critical is
  # noise, and that is the alert-fatigue failure mode this product exists to
  # avoid.
  #
  # Fit it with:  ./venv/bin/python3 calibrate_thresholds.py --sample-dir <enriched dir>
  # and re-fit after every retrain, because new models mean a new distribution.
  # Left commented out here so the template does not ship one site's numbers to
  # another: uncomment and set from the calibration output.
  #
  # score_range:
  #   normal_at:    -0.3691    # p99  of local raw scores -> anomaly 0.0
  #   anomalous_at: -0.6002    # p0.1 of local raw scores -> anomaly 1.0

  # Verdict tiers for the IF sub-score, as raw-score cutoffs. These are also
  # estate-specific; calibrate_thresholds.py prints fitted values.
  thresholds:
    suspicious:       -0.50
    anomalous:        -0.55
    highly_anomalous: -0.60


# ── Autoencoder ───────────────────────────────────────────────────────────────
autoencoder:
  architecture:
    input_dim:   35
    hidden_dims: [24, 12]
    activation:  "relu"
    dropout:     0.1

  training:
    epochs:           30
    batch_size:       4096
    learning_rate:    0.001
    weight_decay:     0.0001
    val_split:        0.2
    early_stopping_patience: 5
    scheduler_step:   10
    scheduler_gamma:  0.5

  threshold_percentile: 95
  device: "cuda"            # trainer device — full retrain on GPU
  inference_device: "cpu"   # streaming engine — CPU AE inference frees GPU SMs for FAISS + co-tenants
  num_workers: 4


# ── HDBSCAN Clusterer ─────────────────────────────────────────────────────────
clusterer:
  min_cluster_size: 5
  min_samples: 3
  metric: "euclidean"
  run_interval_seconds: 900   # was 300; each pass rewrites the whole alerts file
                              # (campaign_id patch) → raise to cut dashboard cache
                              # invalidations + I/O load on the backlogged engine
  buffer_size: 1000
  min_persistence: 0.3


# ── Score Fusion ──────────────────────────────────────────────────────────────
score_fusion:
  isolation_forest_weight: 0.5
  autoencoder_weight: 0.5

  alert_threshold: 0.75

  verdicts:
    - min: 0.75
      max: 0.85
      label: "suspicious"
      confidence: "low"
    - min: 0.85
      max: 0.93
      label: "anomalous"
      confidence: "medium"
    - min: 0.93
      max: 1.00
      label: "highly_anomalous"
      confidence: "high"


# ── RAG (Semantic Retrieval) ──────────────────────────────────────────────────
rag:
  inference_device: cpu          # RAG FAISS index device; cpu frees the shared GPU (set cuda to use GPU)
  top_k: 5
  min_similarity: 0.60
  max_index_size: 7000000        # runtime ceiling — add_to_index() refuses beyond this
  index_build_fraction: 0.8      # trainer seeds the index to 80% of the ceiling,
                                 # leaving headroom so runtime adds can grow it

  embedding_fields:
    - "event_category"
    - "event_outcome"
    - "enrich.temporal.hour"
    - "enrich.temporal.is_business_hours"
    - "enrich.anomalies.is_brute_force"
    - "enrich.anomalies.is_impossible_travel"
    - "enrich.anomalies.is_tor"
    - "enrich.risk_score"
    - "enrich.geo.cross_continent"


# ── User Profile Store (SQLite) ───────────────────────────────────────────────
profile_store:
  # Must stay equal to TRAINING_RETENTION_DAYS in ueba_weekly_retrain.sh. The
  # autoencoders/IF are trained on that window, while this is the window the
  # per-user deviation feature (vector index 34) is measured over — if they
  # disagree, every entity is scored against a baseline built from a different
  # span of history than the model learned. Lowered 30 -> 21 on 2026-09-16
  # alongside the training window; see that file for the disk-pressure reason.
  baseline_window_days: 21

  # How the rolling window is applied (RFP 22).
  #
  #   events — the original behaviour. A fixed-alpha EWMA whose window is
  #            measured in EVENTS, not time: a busy server's baseline turns over
  #            in minutes while a once-a-week account's spans months. In this
  #            mode `baseline_window_days` above is NOT read by anything.
  #
  #   time   — a true rolling period. Statistics are decayed by elapsed time
  #            before each event is folded in, so the effective memory is
  #            `baseline_window_days` of wall clock for every entity, and
  #            categorical values (countries, agents) age out instead of being
  #            remembered forever.
  #
  # SWITCHING REQUIRES A RETRAIN. It changes the distribution of feature [34],
  # which the Isolation Forest and the autoencoders were fitted against; running
  # live traffic through models trained on the other definition is worse than
  # either mode on its own. Change this, then run ueba_weekly_retrain.sh.
  baseline_mode: events
  legacy_alpha: 0.01          # only used when baseline_mode is "events"

  update_interval_seconds: 60
  tracked_fields:
    - typical_hours
    - typical_countries
    - avg_risk_score
    - avg_events_per_hour
    - typical_agents
    - first_seen
    - last_seen
    - total_events


# ── Dashboard API Server ──────────────────────────────────────────────────────
dashboard:
  # agent-sync disabled 2026-08-06: target soc@localhost:2222 was the
  # 222->98 reverse tunnel, decommissioned in the SIEM 222->23 migration
  # (spammed the log with SSH auth failures every poll). Re-enable only
  # after repointing ssh_host at the current SIEM manager with a key.
  agent_sync:
    enabled:        false
  host:             "0.0.0.0"
  port:             3026
  alerts_file:      "/root/NEW_DRIVE/aditya_ueba/ueba_alerts.jsonl"
  agents_registry:  "/root/NEW_DRIVE/aditya_ueba/agents.json"
  # Where the SOC analyst's false-positive flags are persisted. JSON array
  # of {event_id, reason, marked_at}. Rewritten atomically on every mutation.
  false_positives_file: "/root/NEW_DRIVE/aditya_ueba/false_positives.json"
  max_alerts:       500000       # max lines read from the live alerts file per request
  max_feed_alerts:  2000000       # cap per timeline-windowed request (live+archives);
    # Raised from 500000 on 2026-09-09. At 500k the wide windows were
    # silently truncated — 60D showed 495,480 of 1,202,114 (59% missing) and
    # 90D/ALL 72% — so every KPI, user and campaign count on those views was
    # understated. Measured cost of covering all 1.79M: RSS 3.71 -> 3.75 GB
    # (the window snapshot is references to alerts the archive cache already
    # holds), aggregation per window 3.9s -> 14.1s. CPU only, and bounded by
    # the warmer cadence. The feed TABLE is capped separately by feed_row_cap
    # (5000 rows), so payload size is unaffected. If the banner starts saying
    # 'most recent 2,000,000 of ...' again, raise this or shorten history_days.
                                 # evidence is lazy-loaded per row so this stays light
  cache_ttl_secs:   10           # re-read alerts file if older than this

  # AI Security Analyst proxy — Anthropic API key from ANTHROPIC_API_KEY env var.
  # If unset, the dashboard falls back to a locally-generated summary.
  ai_analyst:
    # DISABLED 2026-09-21 for data sovereignty.
    #
    # When enabled this POSTs alert context to https://api.anthropic.com — i.e.
    # SOC event data leaves the premises. That is incompatible with the SLDC
    # tender requirement that "the entire Event, Alerts and other information
    # pertaining to the Organization's SOC must remain within Organization
    # premises only" (RFP point 67), and with on-prem bank deployments generally.
    #
    # The endpoint checks this flag BEFORE building any request, so with it off
    # nothing is sent and the UI falls back to its built-in local summary.
    #
    # Do NOT re-enable on a customer install without written approval. If an
    # AI analyst is wanted on-prem, point it at a locally hosted model instead
    # of an external API.
    enabled:        false
    model:          "claude-sonnet-4-6"   # latest mid-tier Claude
    max_tokens:     1000
    timeout_secs:   20

  # ── Device registry and proactive alerting (RFP 10, 15) ─────────────────────
  # Administrators label devices and assign a priority; notification rules then
  # alert by score, verdict, device priority, device label, MITRE tactic or
  # watch-list membership, over email and/or webhook.
  #
  # Throttling is deliberately conservative. This platform raises tens of
  # thousands of alerts a week, and an unthrottled rule is an inbox outage — at
  # which point the operator mutes the channel and the feature is worth less
  # than nothing. Every rule carries a repeat-suppression window and an hourly
  # ceiling; the defaults are 15 minutes and 20 per hour.
  notify:
    enabled: true
    devices_file: "/root/NEW_DRIVE/aditya_ueba/devices.json"
    rules_file:   "/root/NEW_DRIVE/aditya_ueba/notify_rules.json"
    state_file:   "/root/NEW_DRIVE/aditya_ueba/.state/notify.state"
    # How often the dispatcher checks for newly emitted alerts.
    poll_secs: 15
    # Email uses the same SMTP settings as reporting, below. With no SMTP host
    # configured, email rules are stored but cannot deliver; webhook rules are
    # unaffected.

  # ── Reporting (RFP 34-40, 62) ───────────────────────────────────────────────
  # Out-of-the-box, custom and scheduled reports. Implemented in ueba_reports.py
  # (what a report contains), ueba_report_render.py (PDF/Excel/CSV/HTML/XML) and
  # ueba_report_store.py (saving, scheduling, email delivery).
  reporting:
    enabled: true
    output_dir:       "/root/NEW_DRIVE/aditya_ueba/reports"
    definitions_file: "/root/NEW_DRIVE/aditya_ueba/report_definitions.json"
    schedules_file:   "/root/NEW_DRIVE/aditya_ueba/report_schedules.json"
    history_file:     "/root/NEW_DRIVE/aditya_ueba/report_history.json"
    default_hours: 168          # the period a report covers when none is given
    # Generating a report over a very wide window reads the whole window into
    # memory. This caps what the REPORT endpoints will load, independently of
    # the dashboard's own feed cap, so an analyst asking for "all time" as PDF
    # cannot put the dashboard under memory pressure for everyone else.
    max_window_alerts: 400000
    # Set false to turn off the background scheduler while leaving on-demand
    # report generation working.
    scheduler_enabled: true

    # Email delivery (point 39). Leave `host` empty and delivery is simply
    # disabled: reports still generate and are downloadable, and any schedule
    # with recipients records "smtp not configured" instead of silently doing
    # nothing.
    smtp:
      host:         ""
      port:         587
      starttls:     true
      ssl:          false
      username:     ""
      # PREFER password_env. This file sits on a shared box and is read by
      # several teams; a plaintext password here is a credential leak waiting to
      # happen. Name an environment variable instead and set it in the systemd
      # unit, which is not world-readable.
      password_env: "UEBA_SMTP_PASSWORD"
      password:     ""
      from_addr:    "ueba@cybersentinel.local"
      timeout_secs: 30


# ── Authentication / SSO ──────────────────────────────────────────────────────
# The dashboard shipped with no authentication at all: open CORS, bound to
# 0.0.0.0:3026, every endpoint anonymous. This block is the first half of
# closing that. Implemented in ueba_auth.py.
#
# ROLLOUT ORDER — do not skip step 3:
#   1. enabled: true, enforce: false   ← where we are now. Endpoints exist and
#      sessions can be minted, but nothing is gated. Zero risk to the SOC.
#   2. Have the SIEM team mint a test assertion against the contract below and
#      confirm GET /api/sso/ping reports ready=true, then complete one real
#      round-trip through /auth/sso.
#   3. Only then set enforce: true. Doing it earlier locks analysts out of a
#      live dashboard — the server refuses to start in that state on purpose.
auth:
  enabled:            true
  enforce:            false          # Turned on 2026-09-09 and verified working
                                     # (gate + full login round trip), then turned
                                     # back off the same day: the SIEM does not yet
                                     # redirect analysts to /auth/sso#token=..., so
                                     # the only way in was a hand-minted link from
                                     # ./ueba_login_link.sh — not workable for a SOC.
                                     # Flip to true once the SIEM sends real users
                                     # through, and restart ueba-dashboard.

  # ── Token contract handed to the SIEM team ──
  # We define these; their minter must match exactly or verification fails.
  # Only HS256 is implemented. Setting RS256 raises at startup rather than
  # silently degrading — that path is blocked on their cert PEM (needs
  # IP:103.252.168.197 in the SAN), a confirmed JWKS URL and SIEM host.
  algorithm:          "HS256"
  issuer:             "cybersentinel-siem"    # verified against the `iss` claim
  # Accepted `aud` values. A list is allowed: PyJWT accepts the token if its
  # `aud` matches ANY entry, so this honours both names without ever weakening
  # the audience check itself.
  #   - cybersentinel-ueba : what the SIEM actually mints (confirmed 2026-09-09
  #     from a real csadmin login attempt in the rejection log)
  #   - ueba-dashboard     : the name in the original contract we handed them;
  #     kept so anything already built against it keeps working
  # Once the SIEM confirms one canonical value, drop the other.
  audience:
    - "cybersentinel-ueba"
    - "ueba-dashboard"
  secret_env:         "UEBA_SSO_SECRET"       # read from the environment, never from this file
  leeway_secs:        60                      # clock-skew tolerance
  max_token_age_secs: 300                     # reject a stale assertion even if its exp is generous

  # Required claims: iss, aud, exp, iat, sub.
  # Optional: jti (strongly recommended — it is what makes an assertion
  # single-use), preferred_username, email, name, and the role claim below.

  # ── Sessions ──
  session_ttl_secs:   28800          # 8h absolute lifetime
  session_idle_secs:  3600           # revoked after 1h idle
  cookie_name:        "ueba_session"
  cookie_secure:      false          # set true the moment this is behind TLS
  cookie_samesite:    "Lax"
  auth_db:            "/root/NEW_DRIVE/aditya_ueba/profiles/ueba_auth.db"

  # ── Roles ──
  # Ordered viewer < analyst < admin; a route gated on "analyst" admits admin.
  # An unmapped SIEM group falls through to default_role rather than being
  # refused, so adding a group upstream cannot lock its members out.
  allow_jit:          true           # provision a valid-but-unseen subject on first login
  default_role:       "viewer"
  role_claim:         "roles"        # list[str], or a space/comma-joined string
  role_map:
    ueba-admin:       admin
    soc-lead:         admin
    soc-analyst:      analyst
    soc-viewer:       viewer

  # Never gated, even with enforce on. /api/health must stay open — the
  # engine watchdog probes it every 2 minutes with no credential.
  public_paths:
    - "/api/health"
    - "/api/sso/ping"
    - "/auth/sso"
    - "/api/auth/sso/exchange"

  # Origin allowlist. Empty keeps the historical wide-open CORS. Populate it
  # when enabling enforcement: wildcard origin plus a session cookie is what
  # lets any page an analyst visits read the alert feed.
  cors_origins: []

# ── Streaming Engine ──────────────────────────────────────────────────────────
streaming:
  # ── Where events come from ──────────────────────────────────────────────────
  # file  — tail paths.enriched_input, resuming from a byte offset in
  #         paths.state_file. What the SSH sync bridge fed.
  # kafka — consume the SIEM pipeline's `enriched` topic directly. Correct when
  #         UEBA runs ON the SIEM host: the pipeline already publishes every
  #         enriched event, and its kafka_jsonl_sink.py is just another consumer
  #         writing that topic down to files. Reading the topic instead means no
  #         sync bridge, no second copy on disk (~30 GB/day at the observed
  #         66 events/s), durable offsets kept by Kafka, and replay after an
  #         outage up to topic retention.
  #
  # Default is file so an existing deployment is unchanged by this setting
  # appearing. See ueba_source.py.
  source: file

  kafka:
    # NOTE 39092, not 9092. The pipeline's own layers connect on
    # localhost:39092; 9092 is only reachable inside the broker container.
    brokers: "localhost:39092"
    topic: "enriched"

    # MUST be UEBA's own group. Kafka splits a topic's partitions across the
    # members of a group, so reusing one of the SIEM pipeline's groups
    # (enricher, correlation, scorer, enriched-file-sink, scored-file-sink)
    # would take partitions away from that consumer — the pipeline's file sink
    # would quietly stop receiving a share of events, with no error anywhere.
    # ueba_source.py refuses those names outright.
    group: "ueba-engine"

    # latest = start at the live edge, matching the file source's behaviour of
    # seeking to EOF when there is no saved state. earliest would replay the
    # whole retained topic and present months of historical anomalies as
    # current alerts.
    offset_reset: latest

    # Passed through to the confluent_kafka Consumer verbatim, for site tuning.
    client_config: {}

  poll_interval_ms: 100
  state_save_interval: 1000
  # Isolation Forest batching (2026-08-27). sklearn score_samples() carries a
  # large fixed per-call cost, so we score up to if_batch_size events per call
  # instead of one. read_chunk_bytes must be big enough to yield a real batch:
  # enriched lines average ~5.4 KB, so the old 64 KB chunk held only ~12 events.
  if_batch_size: 128
  read_chunk_bytes: 1048576
  max_partial_buffer_bytes: 1048576
  max_loaded_user_models: 100


# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  max_bytes: 10485760
  backup_count: 5
  format: "%(asctime)s  %(levelname)-8s  %(name)-20s  %(message)s"


# ── Output ────────────────────────────────────────────────────────────────────
output:
  pretty_print: false
  include_feature_vector: false
  include_raw_scores: true
  preserve_original: "all"


# ── Noise Suppression ─────────────────────────────────────────────────────────
noise_suppression:
  signature_ids:
    - "113202"   # MikroTik: L2TP tunnel authenticated (normal VPN login)
    - "81619"    # Fortigate: Multiple high traffic events from same source
    - "81633"    # Fortigate: Multiple IDS events from same source
    - "81634"    # Fortigate: Multiple IDS events from same destination
    - "81644"    # Fortigate: Multiple policy violations from same source
    - "81620"    # Fortigate: Multiple high traffic events from same destination
    - "81621"    # Fortigate: Multiple high traffic events to same port
    - "60107"    # Failed attempt to perform a privileged operation (chrome.exe SocSRV_15)
    - "61602"    # Windows Sysmon error event (DC noise — kernel/Sysmon channel hiccups)
    - "61643"    # Multiple Sysmon error events (DC noise — meta-rule on 61602)
  suppress_zero_risk_network: true
  suppress_ipv6_multicast: true
  suppress_source_ips:
    - "164.52.194.98"   # engine server — reverse tunnel + rsync traffic
  suppress_hostnames_as_users:
    - "cybersentinel-manager"
    - "cybersentinel-manage"
    - "Centos7Trial"


# ── Identity Resolution ───────────────────────────────────────────────────────
identity_resolution:
  enabled: true

  # ── Phase A: canonicalisation ───────────────────────────────────────────────
  # One person arrives under several spellings, so one person gets several
  # baselines, each trained on a fraction of their history. Measured on a
  # 3,412-alert production sample: 10 of 135 identities (7.4%) were duplicates,
  # and 5 autoencoders on disk were second/third copies of the same person.
  #
  # canonicalize de-escapes (DOMAIN\\user → DOMAIN\user), strips the domain
  # prefix, and case-folds — ACCOUNT NAMES ONLY. ip: and host: keys are left
  # alone; see canonical_identity() in ueba_preprocessor.py for why that
  # distinction matters.
  #
  # DEFAULT OFF, AND IT MUST STAY OFF UNTIL A RETRAIN. Changing an entity key
  # changes which autoencoder file is looked up, so turning this on strands
  # every existing per-entity model: those entities fall back to the global
  # model until the next training run rebuilds them under the new keys. Switch
  # it on as part of the retrain on the new server, not on a live deployment.
  canonicalize: false
  casefold: true
  strip_domain: true

  # ── Phase B: typed entity keys ──────────────────────────────────────────────
  # The entity namespace is flat today, so a person, a laptop, a service
  # account and an internet stranger all compete for the same keyspace. The
  # consequences, measured: 397 of 453 autoencoders (87.6%) are keyed on an IP
  # address; 103 of 135 named accounts were seen ONLY from a public source IP
  # (SSH brute-force guesses — janya, jesica, postgres, zabbix, pi, odoo) and
  # each got its own autoencoder; and `root` was one baseline for 912 alerts
  # from 16 different public IPs, so sixteen unrelated attackers averaged into
  # a single profile that none of them deviated from.
  #
  # Typed keys split that five ways:
  #   person:<canonical>        a human being
  #   endpoint:<ip|host>        a machine, and userless internal traffic
  #   service:<account>@<host>  SYSTEM, LOCAL SERVICE, machine accounts
  #   shared:<account>@<host>   root/admin/guest, scoped per host
  #   external:<ip>             an actor out on the internet
  #
  # THE DECISIVE RULE: anything presenting from a public source IP is external,
  # whatever account name it offers, ahead of every other classification. That
  # is what keeps attack traffic out of legitimate baselines. The target
  # endpoint does not absorb it either — that would just move the poisoning
  # onto the server's profile and teach us that being attacked is normal for it.
  #
  # Implies canonicalize (forced on, with a log line, if left off — otherwise
  # person:VGINFO\JINU and person:jinu would be two entities).
  #
  # SAME RETRAIN CAVEAT, LARGER: this rewrites nearly every entity key, so all
  # 453 existing per-entity models are stranded until training rebuilds them.
  # Switch on during the retrain on the new server, never on a live deployment.
  typed_keys: false

  # ── Phase D: identity bindings ──────────────────────────────────────────────
  # Binds a person to the hosts and private addresses they were observed using,
  # so userless internal traffic (endpoint:10.200.11.157) can be attributed to
  # someone. Built from auth events, which is the ONLY stitching source we
  # have: the event_category mix is auth 2596 / system 523 / process 283 /
  # web 9 / other 1 — no DHCP, DNS or VPN feed reaches UEBA. Splunk UBA uses
  # all four and says you need at least one; this is that minimum.
  #
  # There is deliberately no mac field: a MAC address appears nowhere in the
  # data at any nesting depth, so the column would be permanently NULL and
  # would imply a capability we do not have. The schema keys on (kind, value),
  # so mac becomes a new kind when a DHCP feed arrives — no migration.
  #
  # Populating is additive and safe: a separate table, written from the same
  # events, read by nothing yet. The longer it runs before the cutover, the
  # better the history it can answer from. USING a binding to re-attribute an
  # anomaly to a person is the part that changes detection, and that waits for
  # the retrain.
  bindings:
    enabled: false
    retention_days: 90          # a binding is evidence about a period; past it,
                                # a former laptop owner could be named for what
                                # the current one did

  # Accounts that are software, not people. Windows built-ins
  # (NT AUTHORITY\*, NT SERVICE\*, SYSTEM, LOCAL/NETWORK SERVICE) and machine
  # accounts (trailing "$") are detected without being listed; add site-local
  # daemon accounts here.
  service_accounts:
    - "postgres"
    - "mysql"
    - "zabbix"
    - "ftpuser"
    - "deploy"

  # Accounts that exist separately on many machines. These keep their
  # DOMAIN\ / HOST\ prefix instead of being stripped, because 'VGINFO\admin'
  # and 'LAPTOP-07\admin' are different local accounts that merely share a
  # name — collapsing them would create one baseline averaging unrelated
  # actors, which is the exact defect that makes `root` useless today. Phase B
  # replaces this with a proper (account, host) key.
  shared_accounts:
    - "administrator"
    - "admin"
    - "root"
    - "system"
    - "guest"
    - "user"

  # Spelling → canonical identity. Operator overrides for cases the rules above
  # cannot infer (truncation, a personal email address, a nickname). The target
  # is itself canonicalised, so the readable form may be written here.
  #
  # NOTE: until `canonicalize` is on these are applied in ueba_engine.py only,
  # where the trainer never sees them — which is why 3 of the 5 below currently
  # resolve to a model file that training never produced and fall back to the
  # global autoencoder. Phase A is what fixes that.
  mappings:
    # RootSeeker / Sujal — same person, 3 different formats
    "RootSeeker":                  "RootSeeker\\Sujal"
    "sujalthakur2003@outl":        "RootSeeker\\Sujal"

    # LAPTOP-08MIT8SI — truncated vs full username
    "LAPTOP-08MIT8SI":             "LAPTOP-08MIT8SI\\Asus"
    "LAPTOP-08MIT8SI\\Asu":        "LAPTOP-08MIT8SI\\Asus"

    # cybersentinel-manager — truncated hostname
    "cybersentinel-manage":        "cybersentinel-manager"
