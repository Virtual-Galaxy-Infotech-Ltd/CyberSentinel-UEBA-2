    ssh_port: 22
    ssh_key: /root/.ssh/id_ueba
    remote_command: cat /var/ossec/etc/client.keys
    ssh_timeout_secs: 20
  host: 127.0.0.1
  port: 3027
  alerts_file: /opt/ueba/ueba_alerts.jsonl
  agents_registry: /opt/ueba/agents.json

  # ── Email sender (OAuth) ──────────────────────────────────────────────────
  # Lets an admin connect a Gmail or Microsoft 365 mailbox by signing in, so
  # no app password or SMTP server is configured on this box at all. The
  # product is granted permission to SEND as that mailbox only; it cannot read
  # it, and the grant can be revoked from the provider at any time.
  #
  # public_url is the address the ADMIN'S BROWSER reaches this console on, and
  # it is what is sent to Google/Microsoft as the OAuth callback. localhost,
  # on purpose, because the two obvious alternatives do not work here:
  #
  #   * https://10.200.10.23:3026 — Google REFUSES a private IP as a redirect
  #     URI for a web application client.
  #   * https://csen-siem.vgipl.com:3026 — resolves publicly (103.252.168.197)
  #     but 3026 and 443 are filtered from outside, so the provider cannot
  #     send the browser back to it.
  #
  # It must stay https on 3026: that port is nginx, whose server_name already
  # includes "localhost", and auth.cookie_secure is true — the session cookie
  # is not sent over plain http, so forwarding to Flask's 3027 directly would
  # leave the admin unable to log in at all.
  #
  # To connect a mailbox:
  #     ssh -L 3026:localhost:3026 vgipl
  #     open https://localhost:3026   (accept the self-signed certificate)
  #     Alerting -> Email Sender -> Connect Gmail / Connect Microsoft
  # The tunnel is only needed to CONNECT. Mail sends without it afterwards.
  #
  # Register exactly this redirect URI in both provider consoles:
  #     https://localhost:3026/api/email/oauth/callback
  #
  # GET /api/email/status reports `readiness`, which names whatever is still
  # missing. See docs/EMAIL_SETUP.md.
  email:
    public_url: "https://localhost:3026"
    google:
      # Google Cloud Console -> Credentials -> OAuth client ID -> Web
      # application. Enable the Gmail API and add the
      # .../auth/gmail.send scope to the consent screen.
      client_id: ""
      # The secret is NOT kept here: it is read from this environment
      # variable on the ueba-dashboard service (systemctl edit).
      client_secret_env: UEBA_GOOGLE_CLIENT_SECRET
    microsoft:
      # Microsoft Entra -> App registrations -> New registration, platform
      # Web. Delegated Graph permissions: Mail.Send, User.Read,
      # offline_access, openid, email.
      client_id: ""
      client_secret_env: UEBA_MS_CLIENT_SECRET
      # "common" lets both work and personal Microsoft accounts connect.
      tenant: common
  false_positives_file: /opt/ueba/false_positives.json
  max_alerts: 500000
  max_feed_alerts: 2000000
  cache_ttl_secs: 10
  ai_analyst:
    enabled: false
    model: claude-sonnet-4-6
    max_tokens: 1000
    timeout_secs: 20
  notify:
    enabled: true
    devices_file: /opt/ueba/devices.json
    rules_file: /opt/ueba/notify_rules.json
    state_file: /opt/ueba/.state/notify.state
    poll_secs: 15
  reporting:
    enabled: true
    output_dir: /opt/ueba/reports
    definitions_file: /opt/ueba/report_definitions.json
    schedules_file: /opt/ueba/report_schedules.json
    history_file: /opt/ueba/report_history.json
    default_hours: 168
    max_window_alerts: 400000
    scheduler_enabled: true
    smtp:
      # Empty = no relay. Was 127.0.0.1, which had nothing listening on
      # 25, 587 or 465, so the console reported "configured" while no
      # mail could leave and every test send failed on connect. Set this
      # to a real relay, or leave it empty and connect a mailbox under
      # Alerting -> Email Sender (see dashboard.email).
      host: ''
      port: 587
      starttls: true
      ssl: false
      username: ''
      password_env: UEBA_SMTP_PASSWORD
      password: ''
      from_addr: ueba@cybersentinel.local
      timeout_secs: 30
# ── Validation gate (retrain promotion) ─────────────────────────────────────
# A freshly trained model set is scored against real events before it replaces
# the live one. The sample MUST be data the candidate has never seen: a model
# validated on its own training corpus always looks good, and this gate exists
# to catch one that fits its training distribution and floods on everything
# else.
#
# Without this block the gate falls back to paths.enriched_input
# (/opt/ueba/enriched.jsonl), which does not exist on this install — so it
# failed outright and NO retrain could ever promote. That was the last of
# three faults in series; see logs/weekly_retrain.log for 2026-11-01.
#
# sample_dir is the live enriched feed. trained_through_file is the state file
# the weekly pull writes, naming the last chunk folded into the corpus, so
# everything newer in that directory is unseen BY CONSTRUCTION — no second
# copy of the data and nothing to maintain. Absolute, because the validator
# resolves it relative to the working directory.
validation:
  sample_dir: /home/vgipl/CyberSentinel-Event-Correlation-Kafka/data/enriched
  trained_through_file: /opt/ueba/.state/last_train_pull
  # Spread the sample across this many recent chunks rather than draining the
  # newest one, so a single quiet period cannot pass a model that floods at
  # midday.
  max_chunks: 12

