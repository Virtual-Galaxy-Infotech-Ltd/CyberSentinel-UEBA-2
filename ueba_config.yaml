# ── Model tiers (RFP SN 18) ───────────────────────────────────────────────
# Three tiers, most specific first: the entity own model, else the model for
# its behavioural cohort, else the global model. Quiet accounts used to fall
# straight to global, which is the gap SN 18 names.
#
# Cohorts come from paths.peer_groups_file, the same assignment that drives
# peer-group deviation (SN 42), built by build_peer_groups.py. That builder
# now runs BEFORE the trainer in ueba_weekly_retrain.sh (step 3.5): when it
# ran after, the trainer read the previous week assignment and trained no
# cohort models at all.
#
# Absent or unreadable, every entity falls back to the global model and the
# engine says so at startup rather than failing.
model_tiers:
  enabled: true
  # A cohort of one is a per-entity model without the generalisation that
  # justifies the tier.
  cohort_min_members: 2
  # Pooled rows needed before a cohort model is worth building. Below this it
  # memorises its training rows instead of learning the shape.
  cohort_min_rows: 500
