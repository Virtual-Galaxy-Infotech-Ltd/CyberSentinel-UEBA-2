preprocessing:
  chunk_size: 50000
  min_events_per_user: 2000
  # The most rows ONE entity may train on. 0 disables the cap.
  #
  # Not about model quality — 2,000,000 is a thousand times the minimum and
  # far more than a 35-dimension autoencoder needs. It is about peak memory:
  # the slice, the scaled copy, the torch tensor and the train/val split each
  # materialise their own array, so an uncapped entity costs several times
  # its own size.
  #
  # The 15-Nov-2026 retrain died here. One address entity held 18,952,805
  # rows, reached 28.9 GB RSS, and was killed by the kernel six hours in.
  max_events_per_user: 2000000
  feature_fields:
    temporal:
    - enrich.temporal.hour
    - enrich.temporal.day_of_week
    - enrich.temporal.is_weekend
    - enrich.temporal.is_business_hours
    - enrich.temporal.is_night_shift
    flags:
    - enrich.flags.is_auth_event
    - enrich.flags.is_network_event
    - enrich.flags.is_file_event
    - enrich.flags.is_process_event
    anomalies:
    - enrich.anomalies.is_brute_force
    - enrich.anomalies.is_port_scan
    - enrich.anomalies.is_tor
    - enrich.anomalies.is_malicious_ip
    - enrich.anomalies.is_impossible_travel
    - enrich.anomalies.is_lateral_movement
    - enrich.anomalies.is_data_exfiltration
    - enrich.anomalies.is_after_hours
    - enrich.anomalies.is_high_frequency
    counters:
    - enrich.counters.src_ip_5m
    - enrich.counters.src_ip_1h
    - enrich.counters.user_1h
    - enrich.counters.host_1h
    behavioral:
    - enrich.behavioral.unique_destinations_1h
    - enrich.behavioral.unique_ports_1h
    - enrich.behavioral.recent_failures_5m
    geo:
    - enrich.geo.distance_km
    - enrich.geo.cross_border
    - enrich.geo.cross_continent
    risk:
    - enrich.risk_score
    - rule.level
    network:
    - enrich.network_intel.is_cloud_provider
    categorical:
      event_category:
        field: event_category
        mapping:
          auth: 0
          network: 1
          process: 2
          file: 3
          dns: 4
          web: 5
          malware: 6
          cloud: 7
          policy: 8
          system: 9
          unknown: 10
      event_outcome:
        field: event_outcome
        mapping:
          success: 0
          failure: 1
          unknown: 2
      traffic_direction:
        field: enrich.classification.traffic_direction
        mapping:
          inbound: 0
          outbound: 1
          internal: 2
          unknown: 3
  feature_dim: 35
  null_fill_value: 0.0
isolation_forest:
  contamination: 0.005
  n_estimators: 200
  max_samples: auto
  n_jobs: -1
  random_state: 42
  training_sample_size: 500000
  score_range:
    normal_at: -0.3691
    anomalous_at: -0.6002
  thresholds:
    suspicious: -0.5692
    anomalous: -0.5751
    highly_anomalous: -0.6002
autoencoder:
  architecture:
    input_dim: 35
    hidden_dims:
    - 24
    - 12
    activation: relu
    dropout: 0.1
  training:
    epochs: 30
    batch_size: 4096
    learning_rate: 0.001
    weight_decay: 0.0001
    val_split: 0.2
    early_stopping_patience: 5
    scheduler_step: 10
    scheduler_gamma: 0.5
  threshold_percentile: 95
  device: cpu
  inference_device: cpu
  num_workers: 4
clusterer:
  min_cluster_size: 5
  min_samples: 3
  metric: euclidean
  run_interval_seconds: 900
  buffer_size: 1000
  min_persistence: 0.3
score_fusion:
  isolation_forest_weight: 0.5
  autoencoder_weight: 0.5
  alert_threshold: 0.75
  verdicts:
  - min: 0.75
    max: 0.85
    label: suspicious
    confidence: low
  - min: 0.85
    max: 0.93
    label: anomalous
    confidence: medium
  - min: 0.93
    max: 1.0
    label: highly_anomalous
    confidence: high
rag:
  inference_device: cpu
  top_k: 5
  min_similarity: 0.6
  max_index_size: 2000000
  index_build_fraction: 0.8
  embedding_fields:
  - event_category
  - event_outcome
  - enrich.temporal.hour
  - enrich.temporal.is_business_hours
