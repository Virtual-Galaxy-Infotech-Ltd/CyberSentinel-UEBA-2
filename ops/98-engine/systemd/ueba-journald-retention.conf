# CyberSentinel UEBA — keep systemd journal history long enough to forensically
# diagnose an engine stall/crash after the fact. journald is already persistent
# (/var/log/journal exists); this just stops early vacuuming of that history.
[Journal]
Storage=persistent
SystemMaxUse=4G
SystemKeepFree=2G
MaxRetentionSec=30day
